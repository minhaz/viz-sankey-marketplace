name: ci-workflow
on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  ci-build-job:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '20.x'
          cache: 'yarn'
      - run: yarn install --immutable
      - run: yarn lint
      - run: yarn test
      - run: yarn build
